name: Release

# Publica una versión al subir un tag:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Configurar git para los tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - run: go test ./...
      - name: Compilar binarios y checksums
        run: sh scripts/build.sh "${GITHUB_REF_NAME}"
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "gitnomad ${GITHUB_REF_NAME}" \
            --generate-notes
