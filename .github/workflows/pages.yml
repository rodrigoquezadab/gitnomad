name: Sitio web (GitHub Pages)

# Requiere una vez: Settings → Pages → Build and deployment → Source: GitHub Actions
on:
  push:
    branches: [main]
    paths: ["web/**", "scripts/install.*", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio con los instaladores
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp scripts/install.sh scripts/install.ps1 _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
