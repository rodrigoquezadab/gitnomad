name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Configurar git para los tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o dist/ ./cmd/gitsync
      - uses: actions/upload-artifact@v4
        with:
          name: gitsync-${{ matrix.os }}
          path: dist/
